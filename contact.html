.contact-note {

}
.form-group input,
.form-group select,
.form-group textarea {
width: 100%;
padding: 12px 14px;
border: 1.5px solid #D5C5B5;
border-radius: 4px;
font-family: var(--sans);
font-size: 0.92rem;
color: var(--text);
background: var(--white);

appearance: none;
}
.form-group input:focus,
.form-group select:focus,

}

}
.select-wrap {

.form-submit {

.btn-submit {
display: inline-block;
padding: 14px 48px;

font-family: var(--sans);

}

.btn-submit:disabled { opacity: 0.6; cursor: default; }

<div class="contact-hero">
<h1>お問い合わせ</h1>
<p>取材・出演依頼・見学など、お気軽にご連絡ください。</p>
</div>

<div class="contact-body">
<div class="contact-note">
ご返信まで数日いただく場合がございます。お急ぎの場合は InstagramのDMをご利用ください。
</div>

<!-- 送信先: FormSubmit 経由で下川部獅子組のメールアドレスへ届きます。
     ※初回のみ、届く確認メールのリンクをクリックして有効化が必要です。
     有効化後は formsubmit.co/ajax/<専用コード> に差し替えるとアドレスを非公開にできます。 -->
<form id="contact-form" action="https://formsubmit.co/ajax/shimokawanabeshishigumi@gmail.com" method="POST">
<input type="hidden" name="_subject" value="【下川部獅子組】サイトからのお問い合わせ">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">
<input type="text" name="_honey" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="form-group">
<label>お名前 <span class="required">必須</span></label>
<input type="text" name="name" placeholder="山田 太郎" required>
</div>
<div class="form-group">
<label>メールアドレス <span class="required">必須</span></label>
<input type="email" name="email" placeholder="example@example.com" required>
</div>
<div class="form-group">
<label>お問い合わせ種別 <span class="required">必須</span></label>
<div class="select-wrap">
<select name="type" required>
<option value="" disabled selected>選択してください</option>
<option value="取材依頼">取材依頼</option>
<option value="出演依頼">出演依頼</option>
<option value="見学希望">見学希望</option>
<option value="その他">その他</option>
</select>
</div>
</div>
<div class="form-group">
<label>メッセージ <span class="required">必須</span></label>
<textarea name="message" placeholder="ご用件をお書きください" required></textarea>
</div>
<div class="form-submit">
<button type="submit" class="btn-submit">送信する</button>
</div>
</form>

<div class="form-success" id="form-success">
<div class="success-icon">✉️</div>
<h2>送信完了しました</h2>
<p>お問い合わせありがとうございます。<br>数日以内にご返信いたします。</p>
</div>

<div class="instagram-alt">
<p>InstagramのDMからもお問い合わせいただけます</p>
<a href="https://www.instagram.com/shimokawanabe/" target="_blank" rel="noopener" class="btn-instagram">
<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/></svg>
@shimokawanabe
</a>
</div>
</div>

<script src="js/main.js"></script>
<script>
const form = document.getElementById('contact-form');
const success = document.getElementById('form-success');
const submitBtn = form.querySelector('.btn-submit');

form.addEventListener('submit', async e => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = '送信中…';
  try {
    const res = await fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { Accept: 'application/json' }
    });
    // 送信サービスは失敗時もHTTP 200を返すことがあるため、本文の success を確認する
    let data = {};
    try { data = await res.json(); } catch (_) {}
    const sent = res.ok && String(data.success) !== 'false';
    if (sent) {
      form.style.display = 'none';
      success.style.display = 'block';
      return;
    }
    throw new Error(data.message || 'failed');
  } catch (_) {
    alert('送信に失敗しました。時間をおいて再度お試しいただくか、InstagramのDMよりご連絡ください。');
    submitBtn.disabled = false;
    submitBtn.textContent = '送信する';
  }
});
</script>
